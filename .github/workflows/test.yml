name: test

on: [push, pull_request]

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -v tests/test_flow.py

  oracle-21c:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: Ci-sys-pass-0001
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: start sshd on localhost with key auth (for the tunnel tests)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          ssh-keyscan -t ed25519 localhost >> ~/.ssh/known_hosts
      - name: tests against Oracle XE 21c (direct and through the SSH tunnel)
        env:
          ORACLE_SYS_PASSWORD: Ci-sys-pass-0001
          SSH_TEST_KEY: /home/runner/.ssh/id_ed25519
        run: pytest -v -rs tests/test_oracle.py
